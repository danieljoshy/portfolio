<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel Joshy | Anti-Gravity Interface</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <!-- Background Elements -->
        <div class="background-layer">
            <video class="bg-video" autoplay muted loop playsinline>
                <source src="bg-video.mp4" type="video/mp4">
            </video>
            <div class="scanlines"></div>
            <div class="waves"></div>
            <div class="floating-orb orb-1"></div>
            <div class="floating-orb orb-2"></div>
            <div class="floating-orb orb-3"></div>
        </div>

        <!-- Top Navigation -->
        <header class="top-header">
            <div class="nav-container">
                <div class="logo">DANIEL JOSHY</div>
                <nav class="main-nav">
                    <ul>
                        <li><a href="index.html" class="active">Home</a></li>
                        <li><a href="about.html">About</a></li>
                        <li><a href="#">Projects</a></li>
                        <li><a href="#" class="btn-contact">Contact</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <!-- Main Content -->
        <main class="content-layer">
            <div class="profile-card" id="profileCard">
                <div class="card-glow"></div>
                <div class="image-container">
                    <img src="profile.png" alt="Daniel Joshy" class="profile-img">
                </div>
                <div class="text-content">
                    <h1>Hi, I’m <span>Daniel Joshy</span></h1>
                    <p class="subtitle">Engineering Student · Developer · Designer</p>
                </div>
            </div>
        </main>


    </div>

    <script src="script.js"></script>
</body>

</html>
